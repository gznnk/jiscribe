<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'self'; style-src 'self' 'unsafe-inline'"
		/>
		<title>Jiscribe</title>
		<style>
			body {
				margin: 0;
				padding: 32px;
				font-family: system-ui, sans-serif;
				color: #1f2328;
				background: #f6f8fa;
			}
			h1 {
				margin-top: 0;
				font-size: 20px;
			}
			pre {
				padding: 12px 16px;
				border: 1px solid #d0d7de;
				border-radius: 6px;
				background: #ffffff;
				white-space: pre-wrap;
				word-break: break-all;
				user-select: all;
			}
		</style>
	</head>
	<body>
		<h1>Jiscribe</h1>
		<p id="canvas-status">
			No canvas is open. One opens when the app starts; to get one back now,
			start the app again (it reopens the canvas that was open at the last quit
			or Open…).
		</p>
		<p>An AI client connected to this MCP server can open one as well.</p>
		<p>MCP endpoint:</p>
		<pre id="mcp-url"></pre>
		<p><code>.mcp.json</code>:</p>
		<pre id="mcp-config"></pre>
		<script type="module">
			const query = new URLSearchParams(window.location.search);
			const mcpUrl = query.get("mcpUrl") ?? "";
			// Set when every canvas the app tried to open at startup failed; the
			// reason is printed as text, never as markup
			const openFailure = query.get("openFailure");
			if (openFailure !== null) {
				document.getElementById("canvas-status").textContent =
					`Could not open a canvas: ${openFailure}`;
			}
			document.getElementById("mcp-url").textContent = mcpUrl;
			document.getElementById("mcp-config").textContent = JSON.stringify(
				{ mcpServers: { jiscribe: { type: "http", url: mcpUrl } } },
				null,
				2,
			);
		</script>
	</body>
</html>
