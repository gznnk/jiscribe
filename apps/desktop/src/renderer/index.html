<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'self'; style-src 'self' 'unsafe-inline'"
		/>
		<title>Jiscribe</title>
		<style>
			body {
				margin: 0;
				padding: 32px;
				font-family: system-ui, sans-serif;
				color: #1f2328;
				background: #f6f8fa;
			}
			h1 {
				margin-top: 0;
				font-size: 20px;
			}
			pre {
				padding: 12px 16px;
				border: 1px solid #d0d7de;
				border-radius: 6px;
				background: #ffffff;
				white-space: pre-wrap;
				word-break: break-all;
				user-select: all;
			}
		</style>
	</head>
	<body>
		<h1>Jiscribe</h1>
		<p>
			No canvas is open. Connect an AI client to this MCP server, then ask it to
			open a canvas, or use File &rarr; Open&hellip;
		</p>
		<p>MCP endpoint:</p>
		<pre id="mcp-url"></pre>
		<p><code>.mcp.json</code>:</p>
		<pre id="mcp-config"></pre>
		<script type="module">
			const mcpUrl =
				new URLSearchParams(window.location.search).get("mcpUrl") ?? "";
			document.getElementById("mcp-url").textContent = mcpUrl;
			document.getElementById("mcp-config").textContent = JSON.stringify(
				{ mcpServers: { jiscribe: { type: "http", url: mcpUrl } } },
				null,
				2,
			);
		</script>
	</body>
</html>
