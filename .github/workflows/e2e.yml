name: E2E (full)

# The full e2e suite runs only for pull requests targeting main, pushes to main, and manual dispatch.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-full-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e-full:
    name: full e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # pnpm 11 以降は action-setup ではなく後継の pnpm/setup を使う。
      # Node のインストールと store キャッシュもこれ 1 つで賄う。
      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true
          install: false

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright (chromium)
        run: pnpm --filter @jiscribe/canvas exec playwright install --with-deps chromium

      # Every suite: canvas (core), each plugin's own, and canvas-examples' coexistence
      # spec. Sequential on purpose — each starts its own harness dev server, and the
      # timing-sensitive specs (inertial pan) go flaky when suites compete for CPU.
      - name: Run full e2e
        run: pnpm test:e2e

      # test-results/ is what carries the traces and screenshots of the failures; the
      # report alone only names them. Without it a failure that does not reproduce
      # locally cannot be looked into at all.
      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            packages/canvas/playwright-report/
            packages/canvas/test-results/
            plugins/*/playwright-report/
            plugins/*/test-results/
            apps/canvas-examples/playwright-report/
            apps/canvas-examples/test-results/
          retention-days: 7
