name: CI

# - pull_request: only for pull requests targeting main, and only checks (the full e2e
#   suite is run separately by e2e.yml on those pull requests).
# - workflow_dispatch: manual runs, for checking a branch without opening a pull request.
# Pushes do not trigger this workflow: running it on every branch push burns CI minutes
# on work in progress that is checked again on the pull request anyway.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs for the same ref automatically, to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: lint / typecheck / build / unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # pnpm 11 以降は action-setup ではなく後継の pnpm/setup を使う。
      # Node のインストールと store キャッシュもこれ 1 つで賄う。
      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true
          install: false

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Circular dependency check
        run: pnpm dep:check

      # cli の build は render harness も作る。作っていないと harnessAssets の
      # スイートが自分でスキップするので、赤にはならないが検証もされない。
      - name: Build (examples + vscode + cli + mcp)
        run: |
          pnpm build:examples
          pnpm build:vscode
          pnpm build:cli
          pnpm build:mcp

      - name: Unit tests
        run: pnpm test

      - name: AI schema/docs drift check
        run: pnpm check:schema

      # Reads dist/, so it has to come after the build step above.
      - name: Third-party notices drift check
        run: pnpm check:notices

      - name: Shipped fonts.css drift check
        run: pnpm check:fonts

  # VSCode 拡張の e2e テスト。本物の VSCode（engines.vscode の下限 1.85.0 と stable）を
  # 起動して拡張を動かすため、checks とは別ジョブにして並列に回す。
  vscode-e2e:
    name: vscode extension e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # checks ジョブと同じ手順。pnpm 11 以降は action-setup ではなく後継の pnpm/setup を使う。
      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true
          install: false

      - name: Install
        run: pnpm install --frozen-lockfile

      # VSCode 本体のダウンロード（1 バージョンあたり 100MB 超）をランまたぎで残す。
      # キーは .vscode-test.mjs のハッシュなので、あのファイルのバージョン指定を
      # 変えたときだけ取り直す。stable が上流で上がった日は、キャッシュに当たるぶん
      # 新しい stable だけ毎回ダウンロードすることになる（それでも 1.85.0 は残る）。
      - name: Cache VSCode downloads
        uses: actions/cache@v5
        with:
          path: apps/vscode-extension/.vscode-test
          key: vscode-test-${{ runner.os }}-${{ hashFiles('apps/vscode-extension/.vscode-test.mjs') }}
          restore-keys: |
            vscode-test-${{ runner.os }}-

      # VSCode は画面を要求する。runner にはないので xvfb 越しに起動する。
      # XDG_RUNTIME_DIR は 1.85.0 のためにある。あちらは IPC のソケットを
      # $XDG_RUNTIME_DIR（未設定なら /run/user/<uid>）にしか作れず、その
      # ディレクトリが無い環境では EACCES で起動できずに固まる。新しい VSCode は
      # tmpdir へ逃げるので効くのは 1.85.0 側だけ。
      - name: E2E tests
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg-runtime"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          xvfb-run -a pnpm --filter jiscribe test:e2e
