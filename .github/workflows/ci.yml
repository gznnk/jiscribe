name: CI

# - push: lightweight checks only, on every branch. Not run for tags.
# - pull_request: only for pull requests targeting main, and only checks (the full e2e
#   suite is run separately by e2e.yml on those pull requests).
on:
  pull_request:
    branches: [main]
  push:
    branches: ["**"]

# Cancel superseded runs for the same ref automatically, to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: lint / typecheck / build / unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # pnpm 11 以降は action-setup ではなく後継の pnpm/setup を使う。
      # Node のインストールと store キャッシュもこれ 1 つで賄う。
      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true
          install: false

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Circular dependency check
        run: pnpm dep:check

      - name: Build (examples + vscode)
        run: |
          pnpm build:examples
          pnpm build:vscode

      - name: Unit tests
        run: pnpm test

      - name: AI schema/docs drift check
        run: pnpm check:ai
