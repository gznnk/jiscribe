packages:
  - apps/*
  - packages/*
  # Pseudo-external plugins (they may use only the public API of canvas / canvas-sdk)
  - plugins/*
  - "!**/dist/**"
  - "!**/build/**"

# vsix に同梱されるものは範囲ではなく版で書く（@emotion の 2 つは元からこの形）。
# private ルートと 2 つのロックファイルが独立に浮動し、同じ ^ が別の版に解決されて
# THIRD-PARTY-NOTICES が両方で同時に緑にならなくなるため。両ルートで同じ版を書く。
catalog:
  "@emotion/react": 11.14.0
  "@emotion/styled": 11.14.1
  "@types/node": ^22.20.1
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.4
  "@vitejs/plugin-react-swc": ^4.3.3
  "@vitest/coverage-v8": ^4.1.11
  dompurify: 3.4.13
  esbuild: ^0.28.2
  jsdom: ^30.0.1
  katex: 0.18.4
  madge: ^8.0.0
  react: 19.2.8
  react-dom: 19.2.8
  rimraf: ^6.1.3
  typescript: ~5.9.3
  vite: ^7.3.6
  vitest: ^4.1.11

# @vscode/test-cli 0.0.15 が連れてくる mocha 11 は、脆弱性の残る diff 7 と
# serialize-javascript 6 に上限付きで依存している。mocha 12 は両方を上げているが
# ESM 専用になり、test-cli の runner.cjs が require できず VSCode 1.85.0
# （Node 18）の e2e が ERR_REQUIRE_ESM で落ちるため、葉の 2 つだけを上げる。
# どちらも CJS の入口を保っているので mocha 11 から読める。
# 両ルートで同じ内容を保つ。
overrides:
  diff: ^8.0.3
  serialize-javascript: ^7.0.5

# pnpm 11 の allowBuilds（旧 ignoredBuiltDependencies）。列挙外のビルドスクリプトが
# 現れると strictDepBuilds 既定 ON で install が落ちる。
# private ルートの allowBuilds と同じ内容を保つ（electron は private 側のみ）。
allowBuilds:
  "@swc/core": false
  "@vscode/vsce-sign": false
  esbuild: false
  keytar: false
