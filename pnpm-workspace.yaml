packages:
  - apps/*
  - packages/*
  # Pseudo-external plugins (they may use only the public API of canvas / canvas-sdk)
  - plugins/*
  - "!**/dist/**"
  - "!**/build/**"

catalog:
  "@emotion/react": 11.14.0
  "@emotion/styled": 11.14.1
  "@types/node": ^22.10.5
  "@types/react": ^19.2.7
  "@types/react-dom": ^19.2.3
  "@vitejs/plugin-react-swc": ^4.2.2
  "@vitest/coverage-v8": ^2.1.8
  dompurify: ^3.3.1
  esbuild: ^0.24.2
  jsdom: ^29.1.1
  katex: ^0.16.27
  madge: ^8.0.0
  react: ^19.2.3
  react-dom: ^19.2.3
  rimraf: ^6.1.2
  typescript: ~5.9.3
  vite: ^7.3.0
  vitest: ^2.1.8

# pnpm 11 の allowBuilds（旧 ignoredBuiltDependencies）。列挙外のビルドスクリプトが
# 現れると strictDepBuilds 既定 ON で install が落ちる。
# private ルートの allowBuilds と同じ内容を保つ（electron は private 側のみ）。
allowBuilds:
  "@swc/core": false
  "@vscode/vsce-sign": false
  esbuild: false
  keytar: false
